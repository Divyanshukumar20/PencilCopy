<svg
  width="50"
  height="50"
  viewBox="0 0 100 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  style="cursor: pointer"
>
  <!-- Top line: short -->
  <rect x="10" y="20" width="40" height="6" rx="3" fill="#00fff7" />
  
  <!-- Middle line: long + offset -->
  <rect x="5" y="47" width="90" height="6" rx="3" fill="#00fff7" />

  <!-- Bottom line: medium + shifted right -->
  <rect x="25" y="74" width="50" height="6" rx="3" fill="#00fff7" />
</svg>
